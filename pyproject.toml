[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aqi-forecasting"
version = "0.1.0"
description = "Shared feature engineering, metrics, and configuration for Denpasar AQI forecasting."
readme = "README.md"
requires-python = ">=3.13"
# Exact pins live in requirements.txt and environment.yml.
dependencies = ["numpy", "pandas"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "."]
# The notebook is the source of truth and is never reformatted by tooling.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
