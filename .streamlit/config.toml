# Tridatu palette (white, red, black), checked for WCAG AA text contrast.
# AQI category colours are NOT themed: they follow the US EPA scale (NB §3.2).
[theme]
base = "light"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F7"
textColor = "#111111"            # 18.9:1 on white
primaryColor = "#D7192D"         # Tridatu red, 5.2:1 on white
linkColor = "#D7192D"
linkUnderline = true             # links are not identified by colour alone
borderColor = "#D9D9D9"
# Typography (keep in sync with DISPLAY_FONT / BODY_FONT in dashboard/views/components/palette.py):
# - Headings: Playfair Display, an elegant high-contrast serif, from Google Fonts.
# - Body: Times New Roman where installed (Windows, macOS). Elsewhere (Android, Linux) Tinos,
#   a Google Font with the same letter widths as Times New Roman, so layouts do not shift.
headingFont = "Playfair Display:https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap, Georgia, serif"
font = "Times New Roman, Tinos:https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&display=swap, Times, serif"
headingFontWeights = [700, 600]
showSidebarBorder = true         # separates the white sidebar from the white content

[theme.sidebar]
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F7F7F7"
textColor = "#111111"
primaryColor = "#D7192D"         # 4.8:1 on the #F7F7F7 active-item background
linkColor = "#D7192D"
borderColor = "#D9D9D9"

[client]
# Users see a generic message; tracebacks go to the console only (scope §7).
showErrorDetails = "none"

[browser]
gatherUsageStats = false
